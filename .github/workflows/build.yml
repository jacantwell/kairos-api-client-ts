name: Regenerate OpenAPI Client

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-client]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate client
        run: |
          npx @openapitools/openapi-generator-cli generate \
            -g typescript-axios \
            -o src \
            -i https://7zpmbpgf7d.execute-api.eu-west-2.amazonaws.com/api/v1/openapi.json

      - name: Update version (if provided)
        if: ${{ github.event.client_payload.version != '' }}
        run: |
          npm version ${{ github.event.client_payload.version }} --no-git-tag-version

      - name: Build package
        run: npm run build

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: regenerate OpenAPI client (v${{ github.event.client_payload.version }})" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.KAIROS_API_CLIENT_TS_PAT }}@github.com/jacantwell/kairos-api-client-ts.git main

